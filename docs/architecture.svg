<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img">
<title>Basketball scout coordinator architecture</title>
<desc>One-time data download into offline CSVs, then a LangGraph run: input guard, four parallel specialist agents using tools over the CSVs, a validator that retries failing agents once, and a head coach that writes the plan using a memory archive.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .plain { fill: #444441; } .muted { fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
  .leader { stroke: #888780; stroke-width: 0.8; stroke-dasharray: 3 3; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="660" fill="#FFFFFF"/>

<g class="gray"><rect x="40" y="30" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="120" y="54" text-anchor="middle">stats.nba.com</text><text class="ts" x="120" y="73" text-anchor="middle">Online, one time</text></g>
<g class="gray"><rect x="260" y="30" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340" y="54" text-anchor="middle">fetch_data.py</text><text class="ts" x="340" y="73" text-anchor="middle">scripts/</text></g>
<g class="gray"><rect x="480" y="30" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="560" y="54" text-anchor="middle">data/</text><text class="ts" x="560" y="73" text-anchor="middle">6 offline CSVs</text></g>
<line x1="200" y1="58" x2="256" y2="58" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="58" x2="476" y2="58" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="40" y="120" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="120" y="144" text-anchor="middle">run(team, opp)</text><text class="ts" x="120" y="163" text-anchor="middle">scout/graph.py</text></g>
<g class="teal"><rect x="260" y="120" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340" y="144" text-anchor="middle">Input guard</text><text class="ts" x="340" y="163" text-anchor="middle">Valid team codes?</text></g>
<line x1="200" y1="148" x2="256" y2="148" class="arr" marker-end="url(#arrow)"/>
<line class="leader" x1="560" y1="86" x2="560" y2="198"/>
<text class="ts muted" x="552" y="150" text-anchor="end">read by tools.py</text>
<line x1="340" y1="176" x2="340" y2="198" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="200" width="600" height="130" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text class="th plain" x="340" y="227" text-anchor="middle">Specialists run in parallel</text>
<text class="ts muted" x="340" y="245" text-anchor="middle">Each calls only its allowlisted tools</text>
<g class="purple"><rect x="57" y="256" width="128" height="56" rx="8" stroke-width="0.8"/><text class="th" x="121" y="280" text-anchor="middle">Shot chart</text><text class="ts" x="121" y="299" text-anchor="middle">Opponent scoring</text></g>
<g class="purple"><rect x="203" y="256" width="128" height="56" rx="8" stroke-width="0.8"/><text class="th" x="267" y="280" text-anchor="middle">Star coverage</text><text class="ts" x="267" y="299" text-anchor="middle">Our stars vs them</text></g>
<g class="purple"><rect x="349" y="256" width="128" height="56" rx="8" stroke-width="0.8"/><text class="th" x="413" y="280" text-anchor="middle">Defense scheme</text><text class="ts" x="413" y="299" text-anchor="middle">PnR coverages</text></g>
<g class="purple"><rect x="495" y="256" width="128" height="56" rx="8" stroke-width="0.8"/><text class="th" x="559" y="280" text-anchor="middle">Offense plays</text><text class="ts" x="559" y="299" text-anchor="middle">Attack weak D</text></g>
<line x1="340" y1="330" x2="340" y2="366" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="260" y="370" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340" y="394" text-anchor="middle">Validator</text><text class="ts" x="340" y="413" text-anchor="middle">Numbers vs tool output</text></g>
<path d="M420 398 H656 V265 H644" class="arr" marker-end="url(#arrow)"/>
<text class="ts muted" x="538" y="390" text-anchor="middle">Failed: retry once</text>
<line x1="340" y1="426" x2="340" y2="462" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="260" y="466" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340" y="490" text-anchor="middle">Head coach</text><text class="ts" x="340" y="509" text-anchor="middle">Passing reports only</text></g>
<g class="gray"><rect x="480" y="466" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="560" y="490" text-anchor="middle">memory/</text><text class="ts" x="560" y="509" text-anchor="middle">Past plans (jsonl)</text></g>
<line x1="424" y1="494" x2="476" y2="494" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="340" y1="522" x2="340" y2="558" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="240" y="562" width="200" height="44" rx="8" stroke-width="0.8"/><text class="th" x="340" y="589" text-anchor="middle">3-key game plan</text></g>

<g class="purple"><rect x="150" y="630" width="12" height="12" rx="3" stroke-width="0.8"/></g><text class="ts plain" x="168" y="640">LLM agent (Ollama)</text>
<g class="teal"><rect x="310" y="630" width="12" height="12" rx="3" stroke-width="0.8"/></g><text class="ts plain" x="328" y="640">Guardrail check</text>
<g class="gray"><rect x="450" y="630" width="12" height="12" rx="3" stroke-width="0.8"/></g><text class="ts plain" x="468" y="640">Data / files</text>
</svg>
